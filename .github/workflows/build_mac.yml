name: Build Mac App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      # 1. Download your code
      - uses: actions/checkout@v4

      # 2. Install Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # 3.11 is the sweet spot for Tkinter on Mac

      # 3. Install Libraries (No caching line to avoid errors if requirements.txt is missing)
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller ttkbootstrap exifread

      # 4. Build the App
      # CRITICAL: Matches your filename 'SD_Card_Importer.py'
      # CRITICAL: Matches your icon 'Mac_app_icon.icns'
      - name: Build with PyInstaller
        run: |
          pyinstaller --name="SDCardImporter" \
            --onefile \
            --windowed \
            --icon="Mac_app_icon.icns" \
            --collect-all ttkbootstrap \
            --clean \
            SD_Card_Importer.py

      # 5. Zip the App (Preserves Mac Permissions)
      - name: Zip the App
        run: |
          cd dist
          zip -r SDCardImporter_Mac.zip SDCardImporter.app

      # 6. Upload Result
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mac-Build-Output
          path: dist/SDCardImporter_Mac.zip
