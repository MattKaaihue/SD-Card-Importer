name: Build Mac App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      # 1. Download your code to the cloud machine
      - uses: actions/checkout@v4

      # 2. Install Python 3.11 (Very stable for Tkinter apps)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # 3. Install the specific libraries your script uses
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install ttkbootstrap exifread

      # 4. Build the App
      # --collect-all ttkbootstrap: CRITICAL. Ensures the themes are bundled.
      # --windowed: Hides the black terminal window.
      # --icon: Uses your uploaded Mac icon.
      - name: Build with PyInstaller
        run: |
          pyinstaller --name="SDCardImporter" \
            --onefile \
            --windowed \
            --icon="Mac_app_icon.icns" \
            --collect-all ttkbootstrap \
            --clean \
            SD_Card_Importer.py

      # 5. Zip the .app into a zip file (Preserves Mac permissions)
      - name: Zip the App
        run: |
          cd dist
          zip -r SDCardImporter_Mac.zip SDCardImporter.app

      # 6. Upload the result for you to download
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mac-Build-Output
          path: dist/SDCardImporter_Mac.zip
